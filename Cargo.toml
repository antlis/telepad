[package]
name = "telepad"
version = "0.10.0"
edition = "2024"
description = "Rofi quick-switcher that jumps AyuGram/Telegram Desktop to any chat, group or channel across all your accounts"
license = "MIT OR Apache-2.0"
repository = "https://github.com/antlis/telepad"
homepage = "https://github.com/antlis/telepad"
readme = "README.md"
keywords = ["rofi", "telegram", "ayugram", "launcher", "grammers"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
dirs = "6.0.0"
grammers-client = "0.10"
grammers-mtsender = "0.10"
grammers-session = "0.10"
grammers-tl-types = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
toml = "1.1.4"
