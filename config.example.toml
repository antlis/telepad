# telepad configuration — copy to ~/.config/telepad/config.toml
#
# api_id / api_hash: register one app at https://my.telegram.org (free).
# The same pair is reused for every account.
api_id = 123456
api_hash = "0123456789abcdef0123456789abcdef"

# Which Telegram Desktop client to drive: "telegram" (default) or "ayugram".
# This selects the D-Bus service name and X11 window class telepad talks to.
client = "telegram"
#
# For any other TDesktop fork, keep `client` unset (or as-is) and override the
# two client-specific bits explicitly:
#   dbus_service = "org.kotatogram.desktop"   # the D-Bus name it owns
#   window_class = "KotatogramDesktop"        # its X11 window class

# Window-manager integration — only needed if you use multiple accounts (to
# focus the client and press its account-switch shortcut). Both are shell
# commands with placeholders; the defaults target X11 + i3.
#
# focus_cmd: focuses the client window. `{class}` → window_class.
#   i3 (default):  i3-msg [class="{class}"] focus
#   other X11 WMs: wmctrl -xa {class}
#   sway:          swaymsg [app_id={class}] focus
#   hyprland:      hyprctl dispatch focuswindow class:{class}
# focus_cmd = "i3-msg [class=\"{class}\"] focus"
#
# inject_cmd: presses a key chord in the focused window. `{key}` → e.g. "alt+1".
#   X11 (default): xdotool key --clearmodifiers {key}
#   Wayland:       ydotool key {key}    (or wtype)
# inject_cmd = "xdotool key --clearmodifiers {key}"

# One [[accounts]] block per Telegram account.
#
# switch_key: the key you bound *inside the client* to switch to this account
#   (Settings → Advanced → keyboard shortcuts, command "accountN"). telepad runs
#   focus_cmd then inject_cmd with this key before opening a chat, so the jump
#   lands in the right account. Leave empty to never switch (open in whatever
#   account is active).
#
#   NOTE: the tg:// `acc=` deep-link switch crashes AyuGram, so this key path is
#   the only safe way to switch accounts from outside.

[[accounts]]
acc = 1
label = "Personal"
session = "personal"
phone = "+10000000000"   # only used for the initial `telepad login`
switch_key = "alt+1"

[[accounts]]
acc = 2
label = "Work"
session = "work"
phone = "+20000000000"
switch_key = "alt+2"
